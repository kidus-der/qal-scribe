name: CI
on:
  push:
    branches: [main, "ws/**"]
  pull_request:
  workflow_call: # the release workflow runs the same checks before publishing
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest
      - name: Wheel builds, ships NOTICE and runs
        shell: bash
        run: |
          uv build --wheel
          unzip -l dist/*.whl | grep 'qal_scribe/NOTICE'
          # --version needs none of torch; the CPU build keeps the Linux install small
          if [ "$RUNNER_OS" = Linux ]; then export UV_TORCH_BACKEND=cpu; fi
          uvx --from dist/*.whl qal-scribe --version
      - name: Doctor renders its table
        shell: bash
        run: |
          # A CI machine has no microphone, so exit code 1 ("blocked") is expected; a crash is not.
          out=$(uv run qal-scribe doctor || true)
          echo "$out"
          echo "$out" | grep -E 'Ready to dictate|Dictation is blocked'

  # A stock Ubuntu with only the packages the README lists: pynput pulls in evdev, which has no wheels and is
  # compiled at install time. The test job's runner ships compilers and headers, so it cannot catch a gap.
  linux-install:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: The packages the README lists
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates libportaudio2 build-essential python3-dev
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel
      - name: uv tool install, as the README says
        shell: bash
        run: |
          uv tool install --python 3.12 --torch-backend cpu dist/*.whl
          "$(uv tool dir --bin)/qal-scribe" --version
