[project]
name = "qal-scribe"
version = "1.0.2"
description = "On-device push-to-talk dictation for Amharic"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/qal_scribe/NOTICE"]
authors = [{ name = "kidus-der" }]
requires-python = ">=3.12"
keywords = ["amharic", "speech-recognition", "asr", "dictation", "voice-typing", "push-to-talk", "offline", "on-device"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "huggingface-hub>=1.0",
    "numpy>=2.0",
    "pynput>=1.8",
    "rich>=14.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "textual>=8.0",
    "torch>=2.8",
    "transformers>=5.0",
    "pyobjc-framework-applicationservices>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.0; sys_platform == 'darwin'",
    "flashlight-text>=0.0.7 ; python_full_version < '3.13'",  # the LM decoder: no wheels for 3.13+
]

[project.scripts]
qal-scribe = "qal_scribe.cli:main"

[project.urls]
Homepage = "https://github.com/kidus-der/qal-scribe"
Repository = "https://github.com/kidus-der/qal-scribe"
Issues = "https://github.com/kidus-der/qal-scribe/issues"

# Dev and CI only (uv ignores this in published metadata): on Linux take torch from the CPU index so CI and
# `uv sync` skip the multi-GB CUDA wheels. Users on Linux without a GPU: `uv tool install qal-scribe --torch-backend cpu`.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "sacrebleu>=2.6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qal_scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads real model weights (run via scripts/gpu_lock.py, excluded by default)"]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 110
target-version = "py312"
