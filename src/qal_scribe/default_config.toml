# qal-scribe settings. Every line below is commented out and shows the default (except `device`, `words_file`
# and `mic`, which are examples): remove the leading "# " from a line to change that setting.
# Run `qal-scribe doctor` after editing to check the file.

# Language to dictate (`qal-scribe models` lists the available ones).
# language = "amh"

# Push-to-talk keys: hold to record, release to paste. Use pynput key names such as alt_r (Right Option),
# cmd_r (Right Command), ctrl_r (Right Control), shift_r, alt_l or f13.
# dictate_key = "alt_r"
# Speech to English text. Default: cmd_r (Right Command) on macOS, ctrl_r (Right Control) on Linux, because Apple
# keyboards have no Right Control. Set to "" to turn this key off; the translation model is then never fetched.
# translate_key = "cmd_r"

# Translation on or off. false: no translate key, and the translation model is never downloaded or loaded
# (saves 2.5 GB of disk and some memory on small machines). `qal-scribe --no-translate` does the same for one run.
# translation = true
# Which model translates: "nllb-600m" (2.5 GB download, fast, the default) or "nllb-1.3b" (5.5 GB).
# See docs/translation.md for how they compare; both are non-commercial.
# translation_model = "nllb-600m"

# Where the model runs: "mps" (Apple GPU), "cuda" or "cpu". Leave this line out to use the fastest one
# available (the default); the value below is only an example.
# device = "cpu"

# Decode with the model's language model when it ships one: a little more accurate.
# lm = true

# Text clean-up after transcription.
# Write spoken numbers as digits.
# numbers_to_digits = false
# Spell sound-alike letters (ሀ ሐ ኀ, ሰ ሠ, አ ዐ, ጸ ፀ) the same way everywhere.
# merge_homophones = false
# Add punctuation with simple rules. Experimental: expect mistakes.
# punctuation = false
# Your own corrections, one `heard => wanted` per line (lines starting with # are ignored). By default they
# are read from words.txt in qal-scribe's config folder (the folder `qal-scribe config` shows); set this to
# use another file. The path below is only an example.
# words_file = "~/Documents/qal-words.txt"

# Seconds to wait before putting your clipboard back after pasting. Raise it if an app pastes
# your old clipboard instead of the dictated text.
# restore_delay = 0.5

# Play short sounds when recording starts, stops or fails (press v in the app to mute).
# sounds = true

# Microphone: part of its name (e.g. "MacBook Pro Microphone") or its number. Leave this line out to use the
# system default (the default). `qal-scribe doctor` shows which one is used, and lists them all when the
# name matches none.
# mic = "MacBook Pro Microphone"

# Show a live draft of the text while you are still speaking.
# preview = true

# Show a small floating "Listening" / "Transcribing" pill near the bottom of the screen while you hold the key,
# so you can see it works with the terminal hidden. macOS only; ignored on Linux.
# indicator = true

# Once a day at start, ask PyPI whether a newer qal-scribe is out and say so (`qal-scribe update` installs it).
# Sends nothing about you; offline it stays quiet.
# check_updates = true

# Terminal UI. Themes: qal, qal-light, or a built-in Textual theme such as nord, gruvbox, dracula,
# tokyo-night, catppuccin-mocha, solarized-light or textual-dark (press t in the window to try them all).
# theme = "qal"
# compact = false
